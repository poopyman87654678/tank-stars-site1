<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Stars Game Site</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            margin-top: 20px;
        }
        .game-container {
            position: relative;
            width: 90%;
            max-width: 960px;
            height: 540px;
            margin: 20px auto;
            border: 4px solid #e94560;
            border-radius: 10px;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Play Tank Battle</h1>
    <p>Enjoy playing directly in your iPad browser!</p>

    <div class="game-container">
        <!-- This embeds a free web-equivalent tank stars game clone -->
        <iframe src="https://gamedistribution.com" allowfullscreen></iframe>
    </div>

</body>
</html>
